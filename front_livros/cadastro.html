<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Livros</title>
    </head>
    <body>
    <h1>CADASTRAR LIVROS</h1>
    <form id="FormLivros">
        <div class="form-container">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" placeholder="Título" required>
            <br><br>
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Descrição" required>
            <br><br>
            <label for="autor">Autor:</label>
            <input type="text" id="autor" placeholder="Autor" required>
            <br><br>
            <button type="submit">Cadastrar </button>
        </div>
    </form>
    <br>
    <p id="mensagem"></p>
    <br><br>

    <script>
        const API_BASE = "http://localhost/Nicoly/ProjetoGestaoAcervoBibliotecario/api_livros";

        async function getFormData {
            return {
               titulo: document.getElementById('titulo').value,
               autor: document.getElementById('autor').value,
               descricao: document.getElementById('descricao').value, 
            };
        }

        async function postCadastro(livro) {
            try{
                const resposta = await fetch(`${API_BASE/livro}`, {
                    method: "POST",
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(livro) 
                });
                const dados = await resposta.json();
                if(!resposta.ok){
                    throw new Error(`HTTP: ${resposta.status} - ${resposta.status} - ${resposta.message}`);
                }
                return dados;
            } catch(erro){
                throw erro;
            }
            
        }
        async function handleFormSubmit(event){
            event.preventDefault();
            const msg = document.getElementById('mensagem');
            const livro = getFormData();
            try{
                const resultado = await postCadastro(livro);
                msg.textContent = "Livro cadastrado com sucesso!";
                msg.style.color = "green";
                //limpa formulário cadastrado
                document.getElementById('FormCadastrar').reset();
            }catch(erro){
                msg.textContent = `Erro ao cadastrar livro: ${erro.message}`;
                msg.style.color = "red";
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            documet.getElementById("FormCadastrar").addEventListener('submit', handleFormSubmit);
        });
    </script>
            
    </body>
</html>
