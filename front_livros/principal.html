<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Página Principal</title>
    </head>
    <body>
        <h1>Sistema de Gestão de Acervo Bibliotecário</h1>
        <hr>
        <h2>Menu Principal</h2>
        <a href="listaLivros.html"><button id="btnLivros">Livros</button></a>
        <span> ㅤ|||ㅤ </span>
        <a href="movimentarEstoque.html"><button id="btnEstoque">Gestão de Estoque</button></a>
        <span> ㅤ|||ㅤ </span>
        <button id="btnLogout">Logout</button>
        <h3 id="mensagem"></h3>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const usuario = JSON.parse(sessionStorage.getItem("usuario"));
                if (!usuario) {
                    window.location.href = "index.html";
                }
                const msg = document.getElementById("mensagem");

                msg.textContent = `Bem-vindo, ${usuario.nome} ${usuario.sobrenome}!`;
                
            });
        </script>
    </body>
</html>
